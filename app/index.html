<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No inline script, so script-src needs no hashes. worker-src blob: is
     required: MapLibre decodes tiles in a blob: worker. connect-src is left
     open because config.js may point dataBase at another host. -->
<meta http-equiv="Content-Security-Policy"
      content="object-src 'none'; base-uri 'self'; form-action 'none';
               script-src 'self' https://unpkg.com;
               worker-src blob:; child-src blob:">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Forest Monitor · loss and gain alerts</title>
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<link href="vendor/maplibre-gl.css" rel="stylesheet">
<script src="js/boot.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar__title">
      <h1>Forest Monitor</h1>
      <p>Loss and gain alerts &amp; forest cover &mdash; olivinskog &amp; kalklindeskog</p>
    </div>
    <div class="topbar__status" id="data-status" role="status">Loading data&hellip;</div>
  </header>

  <main class="layout">
    <section class="panel panel--map">
      <div class="panel__header">
        <h2>Alert map</h2>
        <div class="controls">
          <label>Forest type
            <select id="filter-forest-type">
              <option value="all">All</option>
              <option value="olivinskog">Olivinskog</option>
              <option value="kalklindeskog">Kalklindeskog</option>
            </select>
          </label>
          <label>Alert type
            <select id="filter-alert-type">
              <option value="loss" selected>Loss</option>
              <option value="gain">Gain</option>
              <option value="all">Both</option>
            </select>
          </label>
          <label>Map: min. confidence
            <select id="filter-confidence">
              <option value="0" selected>Any</option>
              <option value="0.5">0.5</option>
              <option value="0.8">0.8</option>
            </select>
          </label>
          <label>From <input type="month" id="filter-date-from"></label>
          <label>To <input type="month" id="filter-date-to"></label>
        </div>
      </div>
      <div class="controls layer-controls">
        <label class="check"><input type="checkbox" id="toggle-stands" checked> Stands (737)</label>
        <label>Colour stands by
          <select id="stand-color">
            <option value="forest_type" selected>Forest type</option>
            <option value="condition_local">Condition 2025 (local)</option>
            <option value="condition_global">Condition 2025 (global)</option>
            <option value="trajectory">Trajectory 2017&ndash;2025</option>
          </select>
        </label>
        <label class="check" title="Condition score per 10 m cell, 2025, against the stand threshold. Draws from zoom 12.">
          <input type="checkbox" id="toggle-cells"> Condition: 10 m cells (zoom 12+)</label>
      </div>
      <div id="map"></div>
      <div class="legend">
        <span id="stand-legend"></span>
        <span class="legend__item"><i class="dot dot--alert"></i> Loss pixel (10 m)</span>
        <span class="legend__item"><i class="dot dot--gain"></i> Gain pixel</span>
        <span class="legend__item"><i class="dot dot--declining"></i> Declining stand (outline)</span>
      </div>
    </section>

    <section class="panel panel--charts">
      <div class="panel__header">
        <h2>Forest cover over time</h2>
        <div class="controls">
          <label>Resolution
            <select id="cover-resolution">
              <option value="annual" selected>Annual</option>
              <option value="monthly">Monthly</option>
            </select>
          </label>
        </div>
      </div>
      <div id="chart-cover" class="chart"></div>

      <div class="panel__header"><h2>Alert area over time</h2></div>
      <div id="chart-alerts" class="chart"></div>

      <div class="panel__header"><h2>Summary</h2></div>
      <div id="summary-cards" class="summary-cards"></div>
    </section>
  </main>

  <footer class="footer" id="footer-note"></footer>
</div>
<script src="js/app.js"></script>
</body>
</html>
