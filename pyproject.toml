[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.8,<0.12"]

[dependency-groups]
dev = [
  "deptry",
  "pytest"
]

[project]
authors = [
  { name = "Geethen Singh", email = "geethen.singh@nina.no" }
]
dependencies = [
  "duckdb>=1.0",
  "geopandas>=1.0",
  "numba>=0.59",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=15",
  "pyproj>=3.6",
  "pystac-client>=0.8",
  "pyxccd>=1.0.3",
  "rasterio>=1.3",
  "requests>=2.28",
  "s3fs>=2024.2",
  "scipy>=1.10",
  "shapely>=2.0",
  "tqdm>=4.60",
  "typer>=0.12"
]
description = "Forest monitoring for NINA: S-CCD loss alerts (forestmon) and AlphaEarth stand condition"
license = "GPL-3.0-or-later"
name = "effektovervaking_forests"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.optional-dependencies]
# Condition step 02e (Hansen loss year) only.
gee = ["earthengine-api>=1.0"]

[project.scripts]
effektovervaking-forests = "effektovervaking_forests.cli:app"
forestmon = "effektovervaking_forests.cli:app"

[tool.deptry]
known_first_party = ["effektovervaking_forests"]

[tool.deptry.package_module_name_map]
earthengine-api = "ee"

[tool.deptry.per_rule_ignores]
# Parquet engine for pandas/geopandas: used at runtime, never imported by name.
DEP002 = ["pyarrow"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -m 'not network and not smoke'"
markers = [
  "network: hits the AlphaEarth mirror on Source Cooperative (run with -m network)",
  "slow: minutes, not seconds",
  "smoke: read-only checks against the real data dir (set FORESTMON_SMOKE_AOIS)"
]
testpaths = ["tests"]

[tool.ruff]
fix = true

[tool.ruff.format]
# Vendored verbatim from DegreeofRecovery paper_release: re-copy, never edit.
exclude = ["src/effektovervaking_forests/condition/core.py"]

[tool.ruff.lint]
ignore = ["COM812"]
select = ["E", "W", "I", "F", "UP", "S", "B", "A", "COM", "LOG", "PTH", "Q", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Ported field-tested code: sweeping annotation / pathlib / zip-strict rewrites
# are out of scope for the port and risk behaviour changes; revisit incrementally.
"src/*" = [
  "ANN",  # full type annotations not retrofitted onto ported code
  "B905",  # zip(strict=...) would change behaviour on mismatched lengths
  "PTH105",  # os.replace used for atomic writes; semantics identical, left as-is
  "PTH123",  # open() -> Path.open() rewrite not required
  "S603",  # subprocess calls use fixed argv lists (no shell, no user input)
  "S301",  # pickle only reads our own state files written by this package
  "S608",  # SQL built from internal identifiers, not user input
  "S105",  # env-var *name* constant (S3_SECRET_ENV), not a secret
  "B008"  # typer.Argument/Option defaults are the idiomatic typer pattern
]
# Ported condition pipeline, verified output-identical to condition/deploy; the
# same "no behaviour-risking rewrites" rule as src/* applies.
"src/effektovervaking_forests/condition/**" = [
  "B007",  # one unused tuple-unpack name in a VRT band loop
  "B023",  # lambdas passed to .apply/.loc and consumed in the same iteration
  "B904",  # SystemExit from a parse error: the chained traceback adds nothing
  "E501",  # a few long f-string report lines
  "F841"  # one unused unpack in score.threshold_interval_blocked
]
# Vendored verbatim (see [tool.ruff.format]); lint findings are upstream's.
"src/effektovervaking_forests/condition/core.py" = ["ALL"]
"tests/*" = [
  "S101",  # asserts are the point of tests
  "ANN",  # test functions/fixtures/fakes left unannotated
  "B905",  # zip(strict=) not needed in test fixtures
  "S603"  # test runs our own CLI via subprocess with fixed argv
]
